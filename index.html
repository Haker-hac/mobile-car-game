<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121821" />
    <title>Road Rush</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="score-panel">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-panel">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <canvas id="gameCanvas" width="420" height="840" aria-label="Road Rush game"></canvas>

      <div id="startOverlay" class="overlay visible">
        <div class="panel">
          <h1>Road Rush</h1>
          <p>Swipe or tap to dodge traffic.</p>
          <button id="startButton">Play</button>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay hidden">
        <div class="panel">
          <h2>Crash!</h2>
          <p id="finalScoreText">Score: 0</p>
          <button id="restartButton">Restart</button>
        </div>
      </div>

      <div class="controls">
        <button class="control-btn" data-dir="left" aria-label="Move left">◀</button>
        <button class="control-btn" data-dir="right" aria-label="Move right">▶</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
